[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ifc-slab-mesh"
version = "0.1.0"
description = "Constraint-preserving Delaunay triangulation of IFC slab geometries — respects IfcOpeningElement boundaries and produces watertight meshes for slabs with cutouts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Daud Tasleem", email = "daudtasleem215@gmail.com" }]
keywords = ["ifc", "bim", "triangulation", "constrained-delaunay", "geospatial", "mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "ifcopenshell>=0.7.0",
    "triangle>=20230923",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
    "mypy>=1.6",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
ifc-slab-mesh = "ifc_slab_mesh.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "E741", "F401", "F811", "F821", "I001"]
"benchmarks/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

